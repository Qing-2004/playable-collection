<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f0e8">
<title>试玩间｜8款试玩合集</title>
<style>
:root{--ink:#171816;--paper:#f4f0e8;--line:rgba(23,24,22,.16);--muted:#65655f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{background:radial-gradient(circle at 12% 4%,rgba(255,255,255,.95),transparent 28rem),var(--paper)}button{font:inherit}.shell{width:min(1480px,100%);margin:auto;padding:0 42px}.header{display:flex;min-height:88px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-weight:760}.mark{display:grid;grid-template-columns:repeat(3,5px);align-items:end;gap:3px;width:21px;height:21px;padding:3px;border:1px solid;border-radius:50%}.mark i{display:block;width:5px;border-radius:5px;background:var(--ink)}.mark i:nth-child(1){height:6px}.mark i:nth-child(2){height:12px}.mark i:nth-child(3){height:9px}.count{display:flex;align-items:center;gap:9px;color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.dot{width:7px;height:7px;border-radius:50%;background:#56a56f;box-shadow:0 0 0 4px rgba(86,165,111,.13)}.hero{display:grid;grid-template-columns:180px minmax(0,1fr) 290px;align-items:end;gap:30px;padding:80px 0 76px}.eyebrow,.hero p,.section-title span,.meta,.footer{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.eyebrow{align-self:start;margin:12px 0 0;color:var(--muted);font-size:10px;letter-spacing:.12em}.hero h1{margin:0;font-size:clamp(58px,8.2vw,126px);font-weight:560;letter-spacing:-.075em;line-height:.84}.hero h1 span{color:transparent;-webkit-text-stroke:1.5px var(--ink)}.hero p{margin:0 0 8px;color:var(--muted);font-size:13px;line-height:1.8}.section-title{display:flex;align-items:baseline;justify-content:space-between;padding:17px 0;border-top:1px solid var(--ink)}.section-title h2{margin:0;font-size:16px}.section-title span{color:var(--muted);font-size:10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding-bottom:78px}.card{overflow:hidden;padding:0;border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.44);color:inherit;text-align:left;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}.card:hover{transform:translateY(-5px);box-shadow:0 22px 60px rgba(39,35,28,.11)}.art{position:relative;height:235px;overflow:hidden;background:var(--card)}.tone-aqua{--card:#9bdedb;--accent:#ff937c}.tone-rose{--card:#e7a9bd;--accent:#6f65a5}.tone-peach{--card:#f1b99a;--accent:#d95f78}.tone-butter{--card:#f5cf69;--accent:#657cbd}.tone-lilac{--card:#c6b5e7;--accent:#ef6c70}.tone-coral{--card:#ed8e7d;--accent:#4e7d69}.tone-mint{--card:#a8cfb2;--accent:#f4d274}.tone-blue{--card:#9ebdde;--accent:#e67766}.orbit{position:absolute;border:1px solid rgba(23,24,22,.3);border-radius:50%}.o1{width:210px;height:210px;right:-45px;top:18px}.o2{width:105px;height:105px;left:18px;bottom:-28px;border:0;background:var(--accent);opacity:.78}.figure{position:absolute;left:50%;bottom:-35px;width:142px;height:205px;transform:translateX(-50%)}.head,.bodyshape{position:absolute;display:block;background:rgba(246,237,220,.95);border:1px solid rgba(23,24,22,.34)}.head{top:0;left:43px;width:59px;height:70px;border-radius:48%}.bodyshape{bottom:0;width:142px;height:141px;border-radius:70px 70px 6px 6px}.number{position:absolute;top:15px;left:17px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}.content{display:flex;min-height:160px;flex-direction:column;justify-content:space-between;padding:19px}.meta{margin:0 0 15px;color:var(--muted);font-size:9px;letter-spacing:.08em}.content h3{margin:0 0 5px;font-size:21px;letter-spacing:-.04em}.sub{color:var(--muted);font-size:11px}.card-bottom{display:flex;align-items:end;justify-content:space-between}.code{color:var(--muted);font:9px ui-monospace,SFMono-Regular,Menlo,monospace}.arrow{display:grid;width:34px;height:34px;place-items:center;border:1px solid;border-radius:50%;font-size:18px}.footer{display:flex;justify-content:space-between;padding:24px 0 30px;border-top:1px solid var(--line);color:var(--muted);font-size:9px;letter-spacing:.1em}.player{position:fixed;inset:0;z-index:50;display:none;grid-template-rows:62px minmax(0,1fr);background:#10110f}.player.show{display:grid}.player.focus{grid-template-rows:0 minmax(0,1fr)}.player.focus .bar{overflow:hidden;border:0;opacity:0}.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:max(0px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left));border-bottom:1px solid rgba(255,255,255,.14);background:#171816;color:#fff;transition:.2s}.back,.actions button{border:0;background:transparent;color:inherit;cursor:pointer}.back{justify-self:start;font-size:12px}.game-title{display:flex;align-items:baseline;gap:9px}.game-title strong{font-size:13px}.game-title small{color:rgba(255,255,255,.48);font:9px ui-monospace,SFMono-Regular,Menlo,monospace}.actions{display:flex;justify-self:end;gap:8px}.actions button{padding:8px 12px;border:1px solid rgba(255,255,255,.35);border-radius:99px;font-size:11px}.actions .primary{background:white;color:#171816}.stage{position:relative;min-height:0}.stage iframe{display:block;width:100%;height:100%;border:0;background:#000}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#10110f;color:#fff;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em}.loading.hide{display:none}.player:fullscreen{width:100vw;height:100vh}.playing{overflow:hidden}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:1fr;gap:24px;padding:56px 0}.eyebrow{margin:0}}@media(max-width:760px){.shell{padding:0 20px}.header{min-height:72px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.art{height:220px}.bar{grid-template-columns:1fr auto}.game-title{display:none}}@media(max-width:480px){.shell{padding:0 14px}.hero h1{font-size:17vw}.grid{grid-template-columns:1fr}.art{height:250px}.count{font-size:9px}.actions button:first-child{display:none}.footer{flex-direction:column;gap:7px}}
</style>
</head>
<body>
<main class="shell">
  <header class="header"><div class="brand"><span class="mark"><i></i><i></i><i></i></span><span>试玩间</span></div><div class="count"><span class="dot"></span>8 个试玩已就绪</div></header>
  <section class="hero"><div class="eyebrow">PLAYABLE ARCHIVE · 2026</div><h1>所有试玩，<br><span>一个 H5。</span></h1><p>选择一个项目，直接开始试玩。<br>点击后仅加载当前试玩文件。</p></section>
  <section><div class="section-title"><h2>试玩项目</h2><span>点击卡片开始</span></div><div class="grid" id="grid"></div></section>
  <footer class="footer"><span>PLAYABLE COLLECTION</span><span>SINGLE FILE · 8 GAMES</span></footer>
</main>
<section class="player" id="player">
  <header class="bar"><button class="back" id="back">← 返回试玩间</button><div class="game-title"><strong id="game-title"></strong><small id="game-code"></small></div><div class="actions"><button id="new-window">单独打开</button><button class="primary" id="fullscreen">全屏</button></div></header>
  <div class="stage" id="stage"><div class="loading" id="loading">正在载入试玩…</div><iframe id="game-frame" allow="autoplay; fullscreen; accelerometer; gyroscope" allowfullscreen title="H5 试玩"></iframe></div>
</section>
<script>
const games=[{"slug":"pno431","title":"卸妆护肤","subtitle":"护理步骤试玩","code":"PNO431","kind":"装扮 · 护肤","tone":"aqua","bytes":4911084,"sha256":"438876e1cce9ce00ad5384aa23d45d59ad55780f36a46eb51cd0deeeb0d85a0a"},{"slug":"pno379","title":"换装贴纸书","subtitle":"Sticker Closet","code":"PNO379","kind":"装扮 · 贴纸书","tone":"rose","bytes":4673480,"sha256":"7e0935c2060cc85c4c5e1b7509eb4432db201431f07c87bd64d0b7de85a7ccf2"},{"slug":"pno352","title":"粉色小屋","subtitle":"小屋装扮试玩","code":"PNO352","kind":"装扮 · 小屋","tone":"peach","bytes":2806450,"sha256":"e300281e0084ac517acc5162a5d1d0e92a88d87256f347f2f9650fe3a025269b"},{"slug":"management","title":"模拟经营","subtitle":"经营主题试玩","code":"PLAY 04","kind":"模拟 · 经营","tone":"butter","bytes":4546401,"sha256":"f2e00786477d5597d9037a04329b9849f3c4942d340415cd12522301b8346067"},{"slug":"pno280","title":"三轮主题穿搭","subtitle":"舞会造型挑战","code":"PNO280","kind":"换装 · 主题","tone":"lilac","bytes":4540291,"sha256":"c5c57473f5364cb1f02726db30db0d37c6d7464f83d32992d5aa62ae8535204c"},{"slug":"pno188","title":"三轮穿搭选择","subtitle":"Style Queen","code":"PNO188","kind":"换装 · 选择","tone":"coral","bytes":3657343,"sha256":"80dfde720bde9752f112c1a2b4968d43405b5d5d3dd0b301c4fd3bee9b141a99"},{"slug":"pno257","title":"耳朵细节装扮","subtitle":"细节造型试玩","code":"PNO257","kind":"装扮 · 细节","tone":"mint","bytes":4765314,"sha256":"650720d87c41f078b45c3970ada7a19365b14b91d8dfa17cb0611ddf074e4962"},{"slug":"pno256","title":"丑男改造","subtitle":"角色装扮试玩","code":"PNO256","kind":"装扮 · 改造","tone":"blue","bytes":4765334,"sha256":"d44d194ff1d0786808d62a001c91fb611748cc799b34fa7dd042f647e10f9038"}];
const grid=document.getElementById('grid');
const player=document.getElementById('player');
const frame=document.getElementById('game-frame');
const loading=document.getElementById('loading');
const stage=document.getElementById('stage');
let activeUrl='';
let activeGame=null;
games.forEach(function(game,index){
  const card=document.createElement('button');
  card.className='card tone-'+game.tone;
  card.innerHTML='<div class="art"><span class="orbit o1"></span><span class="orbit o2"></span><span class="figure"><i class="head"></i><i class="bodyshape"></i></span><span class="number">0'+(index+1)+'</span></div><div class="content"><div><p class="meta">'+game.kind+'</p><h3>'+game.title+'</h3><span class="sub">'+game.subtitle+'</span></div><div class="card-bottom"><span class="code">'+game.code+'</span><span class="arrow">↗</span></div></div>';
  card.addEventListener('click',function(){openGame(game)});
  grid.appendChild(card);
});
function openGame(game){
  activeGame=game;
  loading.classList.remove('hide');
  player.classList.add('show');
  document.body.classList.add('playing');
  document.getElementById('game-title').textContent=game.title;
  document.getElementById('game-code').textContent=game.code;
  activeUrl='games/'+game.slug+'/index.html';
  frame.src=activeUrl;
}
frame.addEventListener('load',function(){if(frame.src!=='about:blank')loading.classList.add('hide')});
document.getElementById('back').addEventListener('click',closeGame);
function closeGame(){
  player.classList.remove('show','focus');
  document.body.classList.remove('playing');
  frame.src='about:blank';
  activeUrl='';activeGame=null;
}
document.getElementById('new-window').addEventListener('click',function(){if(activeUrl)window.open(activeUrl,'_blank')});
document.getElementById('fullscreen').addEventListener('click',async function(){
  if(player.requestFullscreen){try{await player.requestFullscreen();return}catch(error){}}
  player.classList.toggle('focus');
});
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement)player.classList.remove('focus')});
document.addEventListener('keydown',function(event){if(event.key==='Escape'&&player.classList.contains('show')&&!document.fullscreenElement)closeGame()});
</script>
</body>
</html>
